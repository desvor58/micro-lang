name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y make gcc

      - name: Build and run tests (debug + release)
        run: make test
        env:
          CC: ${{ matrix.cc }}