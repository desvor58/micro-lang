[package]
name = "microc"
version = "dev-0"

[build]
language = "c"
standard = "c99"
compiler = "gcc"
cflags   = ["-Wall", "-Wextra", "-Wshadow", "-Wpointer-arith",
            "-Wno-format", "-Wno-missing-braces", "-Wno-unused-parameter",
            "-fno-strict-aliasing",
            "-Iinclude"]

[build.x86_64-pc-windows-msvc]
ldflags = ["-Llib", "-lsct-win"]

[build.x86_64-unknown-linux-gnu]
ldflags = ["-Llib", "-lsct-elf"]

[dependencies]
